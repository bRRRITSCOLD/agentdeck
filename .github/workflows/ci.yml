name: CI

# `cargo xtask ci` runs the same chain locally; a unit test in xtask keeps the two in step.

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_PROFILE_TEST_DEBUG: 0

jobs:
  fmt:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          cache: false
      - run: cargo fmt --all --check

  clippy:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/linux-deps
        timeout-minutes: 10
      - uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          cache-save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-shared-key: clippy
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings

  test-unit:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/linux-deps
        timeout-minutes: 10
      - uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          cache-save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-shared-key: test
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest@0.9.151
      - run: cargo test-unit-ci

  test-integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/linux-deps
        timeout-minutes: 10
      - uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          cache-save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-shared-key: test-integration
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest@0.9.151
      - run: cargo test-integration-ci

  doc:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      RUSTDOCFLAGS: -D warnings
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/linux-deps
        timeout-minutes: 10
      - uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          cache-save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-shared-key: doc
      - run: cargo doc --workspace --no-deps --locked
