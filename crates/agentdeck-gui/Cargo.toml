[package]
name = "agentdeck-gui"
description = "The agentdeck GPUI app."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
agentdeck-client.workspace = true
agentdeck-core.workspace = true
# The terminal model each attached pane is fed into; our own renderer draws it (spec §11).
alacritty_terminal.workspace = true
anyhow.workspace = true
chrono.workspace = true
brrritscold-core-gpui.workspace = true
brrritscold-core-gpui-tokens.workspace = true
gpui.workspace = true
# `InputEvent`, which core-gpui's `InputState` emits but doesn't re-export.
gpui-base.workspace = true
gpui-platform = { workspace = true, features = ["x11", "wayland"] }
# The daemon's client and WebSocket need tokio's reactor; the GUI keeps a small runtime.
tokio.workspace = true
# A debug line for a link a click refuses to open.
tracing.workspace = true

[dev-dependencies]
gpui = { workspace = true, features = ["test-support"] }

[lints]
workspace = true
