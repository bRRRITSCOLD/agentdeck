[package]
name = "agentdeck-core"
description = "GPUI-free domain types for agentdeck: ids, states and the state rules engine."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[features]
# `state::screen`: reads an `alacritty_terminal::Term`'s screen into rows for the rules. Off by
# default so core's own dependencies stay free of IO crates (alacritty_terminal ships a PTY
# layer); the daemon turns it on. Core's unit tests always build it, through the dev-dependency.
screen = ["dep:alacritty_terminal"]
# `schemars::JsonSchema` for the types the daemon's API carries (ids, column enums, the layout
# tree), so dropshot can describe them in openapi.json. Off by default; the daemon turns it on.
schemars = ["dep:schemars"]

[dependencies]
alacritty_terminal = { workspace = true, optional = true }
regex.workspace = true
schemars = { workspace = true, optional = true }
serde.workspace = true
shell-words.workspace = true
thiserror.workspace = true
toml.workspace = true
uuid.workspace = true
vte.workspace = true

[dev-dependencies]
alacritty_terminal.workspace = true
serde_json.workspace = true

[lints]
workspace = true
