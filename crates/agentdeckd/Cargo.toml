[package]
name = "agentdeckd"
description = "The agentdeck daemon: owns the terminals and the data, serves the HTTP API."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
agentdeck-core = { workspace = true, features = ["schemars", "screen"] }
alacritty_terminal.workspace = true
anyhow.workspace = true
async-trait.workspace = true
chrono.workspace = true
dropshot.workspace = true
# PR sync calls GitHub over HTTPS: rustls with the platform verifier (aws-lc-rs, already in the
# lock through GPUI).
reqwest = { workspace = true, features = ["rustls"] }
futures-util.workspace = true
nix.workspace = true
portable-pty.workspace = true
rusqlite.workspace = true
rusqlite_migration.workspace = true
schemars.workspace = true
semver.workspace = true
serde.workspace = true
serde_json.workspace = true
slog.workspace = true
thiserror.workspace = true
toml.workspace = true
toml_edit.workspace = true
tokio.workspace = true
tokio-tungstenite.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
uuid.workspace = true

[dev-dependencies]
agentdeck-client.workspace = true
httpmock.workspace = true
tempfile.workspace = true
tokio-tungstenite = { workspace = true, features = ["connect"] }

[lints]
workspace = true
