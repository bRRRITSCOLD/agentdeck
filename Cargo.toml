[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99.1"
license = "MIT OR Apache-2.0"
repository = "https://github.com/bRRRITSCOLD/agentdeck"
publish = false

[workspace.dependencies]
# Workspace crates.
agentdeck-client = { path = "crates/agentdeck-client" }
agentdeck-core = { path = "crates/agentdeck-core" }

# rust-packages: every brrritscold-* crate at the same tag. A bump is one commit: the new tag
# plus the GPUI pin block below copied from that tag's Cargo.toml.
brrritscold-core-gpui = { git = "https://github.com/bRRRITSCOLD/rust-packages", tag = "v0.1.1" }

# The GPUI pin, copied as-is from rust-packages v0.1.1's Cargo.toml. `gpui-base` is the one
# choice; every gpui-pre* line is derived from its `=` requirements. If these drift from the
# tag's, Cargo fails to resolve two `=` pins, and that error is the guard.
gpui-base = "=0.9.1"
gpui = { package = "gpui-pre", version = "=0.3.12" }
gpui-macros = { package = "gpui-pre-macros", version = "=0.3.12" }
gpui-platform = { package = "gpui-pre-platform", version = "=0.3.12" }
gpui-reqwest-client = { package = "gpui-pre-reqwest-client", version = "=0.3.12" }
gpui-sum-tree = { package = "gpui-pre-sum-tree", version = "=0.3.12" }

anyhow = "1"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"
