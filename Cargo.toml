[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99.1"
license = "MIT OR Apache-2.0"
repository = "https://github.com/bRRRITSCOLD/agentdeck"
publish = false

[workspace.dependencies]
# Workspace crates.
agentdeck-client = { path = "crates/agentdeck-client" }
agentdeck-core = { path = "crates/agentdeck-core" }
agentdeck-notify = { path = "crates/agentdeck-notify" }

# rust-packages: every brrritscold-* crate at the same tag. A bump is one commit: the new tag
# plus the GPUI pin block below copied from that tag's Cargo.toml.
brrritscold-core-gpui = { git = "https://github.com/bRRRITSCOLD/rust-packages", tag = "v0.2.0" }
brrritscold-core-gpui-tokens = { git = "https://github.com/bRRRITSCOLD/rust-packages", tag = "v0.2.0" }

# The GPUI pin, copied as-is from rust-packages v0.2.0's Cargo.toml. `gpui-base` is the one
# choice; every gpui-pre* line is derived from its `=` requirements. If these drift from the
# tag's, Cargo fails to resolve two `=` pins, and that error is the guard.
gpui-base = "=0.11.0"
gpui = { package = "gpui-pre", version = "=0.3.14" }
gpui-macros = { package = "gpui-pre-macros", version = "=0.3.14" }
gpui-platform = { package = "gpui-pre-platform", version = "=0.3.14" }
gpui-reqwest-client = { package = "gpui-pre-reqwest-client", version = "=0.3.14" }
gpui-sum-tree = { package = "gpui-pre-sum-tree", version = "=0.3.14" }

anyhow = "1"
regex = "1"
toml = "1"
# The terminal model (Apache-2.0). Pinned exactly: the daemon's snapshots and core's screen
# observation read its grid, so a bump is a deliberate, tested change.
alacritty_terminal = "=0.26.0"
# The escape-sequence parser alacritty_terminal uses, for the OSC 9;4 and 7501 sequences it
# ignores. Kept at the version alacritty_terminal pulls in.
vte = { version = "0.15", default-features = false, features = ["std"] }

# Exact pins, each at least two weeks old when added. dropshot 0.17 is on schemars 0.8 and slog;
# rusqlite follows the line rusqlite_migration 2.6 supports; reqwest follows progenitor-client.
async-trait = "=0.1.92"
# The CLI's argument parser (MIT OR Apache-2.0).
clap = { version = "=4.6.7", features = ["derive", "env"] }
chrono = { version = "=0.4.45", default-features = false, features = ["clock", "std"] }
dropshot = "=0.17.1"
# Integration tests only: GitHub's GraphQL API, intercepted (MIT). Default features off (cookies).
httpmock = { version = "=0.9.0", default-features = false }
# The daemon's credential store (spec §8): keyring-core's API over the keyring project's Secret
# Service store, on the zbus 5 line GPUI already pulls in (MIT OR Apache-2.0).
keyring-core = "=1.0.1"
zbus-secret-service-keyring-store = { version = "=1.0.1", features = ["crypto-rust"] }
# GPUI's own records, which the GUI's log bridges into `tracing`; its test writes one. Already in
# the lockfile through GPUI.
log = "=0.4.35"
# The desktop notifier's request queue; already in the lockfile through futures-util.
futures-channel = { version = "=0.3.34", default-features = false, features = ["std"] }
# For `StreamExt` / `SinkExt` on the WebSocket; already in the lockfile through dropshot.
futures-util = { version = "=0.3.34", default-features = false, features = ["sink", "std"] }
# SIGHUP / SIGKILL to a pane's process group, SIGTERM to a daemon being restarted,
# without `unsafe`; portable-pty's own nix line.
nix = { version = "=0.28.0", default-features = false, features = ["process", "signal"] }
openapiv3 = "=2.2.0"
# The daemon's PTYs (MIT).
portable-pty = "=0.9.0"
prettyplease = "=0.3.0"
progenitor = { version = "=0.15.1", default-features = false }
progenitor-client = "=0.15.1"
reqwest = { version = "=0.13.5", default-features = false, features = ["json", "query"] }
# `fallible_uint`: u64 columns (GitHub's repository ids), checked against i64 as they go in and out.
rusqlite = { version = "=0.40.2", features = ["bundled", "fallible_uint"] }
rusqlite_migration = "=2.6.0"
schemars = { version = "=0.8.22", features = ["uuid1"] }
semver = "=1.0.28"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
slog = "=2.8.2"
# Splits `terminal.file_opener` into words as a shell would, so it never runs through `sh -c`
# (MIT OR Apache-2.0); already in the lockfile through GPUI.
shell-words = "=1.1.1"
syn = { version = "=3.0.9", features = ["full"] }
tempfile = "=3.27.0"
thiserror = "=2.0.21"
tokio = { version = "=1.54.1", features = ["macros", "rt-multi-thread", "signal", "sync", "time"] }
# The WebSocket protocol over dropshot's upgraded connection (MIT). The integration tests'
# client turns on `connect`.
tokio-tungstenite = { version = "=0.30.0", default-features = false }
# `config.toml` edits that keep the user's comments and unknown keys (MIT OR Apache-2.0);
# already in the lockfile through GPUI's proc-macro-crate.
toml_edit = "=0.25.19"
tracing = "=0.1.44"
tracing-subscriber = "=0.3.23"
uuid = { version = "=1.28.0", features = ["serde", "v4", "v7"] }
# The GUI's desktop notifications (MIT), and their contract test's fake notification server on
# a private bus. The zbus GPUI's Linux platform already pulls in through notify-rust, with its
# own runtime.
zbus = { version = "=6.2.1", default-features = false, features = ["default-rt"] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"
