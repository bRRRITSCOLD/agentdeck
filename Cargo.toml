# PROTOTYPE (issue #2). Throwaway spike, never merged into main.
[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.99.1"
license = "MIT OR Apache-2.0"
publish = false

[workspace.dependencies]
# rust-packages' GPUI pin, copied as-is.
gpui-base = "=0.9.1"
gpui = { package = "gpui-pre", version = "=0.3.12" }
gpui-macros = { package = "gpui-pre-macros", version = "=0.3.12" }
gpui-platform = { package = "gpui-pre-platform", version = "=0.3.12" }
gpui-reqwest-client = { package = "gpui-pre-reqwest-client", version = "=0.3.12" }
gpui-sum-tree = { package = "gpui-pre-sum-tree", version = "=0.3.12" }

anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
image = { version = "0.25", default-features = false, features = ["png"] }
